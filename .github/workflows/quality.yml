name: Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type checking
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests + coverage 80%
        run: node --test --experimental-test-coverage --test-coverage-lines=80 tests/repository-quality.test.mjs
      - name: Owner quality integration
        env:
          GITHUB_TOKEN: ''
        run: npx --yes tsx@4.20.6 scripts/verify-owner-quality.ts
      - name: Build
        run: npm run build
